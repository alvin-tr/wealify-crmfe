services:
  crm-web:
    image: ghcr.io/wealify/crm-web-main:latest
    container_name: crm-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://localhost:4000}
      - NUXT_PUBLIC_PUSHER_KEY=${NUXT_PUBLIC_PUSHER_KEY:-}
      - NUXT_PUBLIC_PUSHER_CLUSTER=${NUXT_PUBLIC_PUSHER_CLUSTER:-ap1}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
